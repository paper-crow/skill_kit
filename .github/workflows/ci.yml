name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the skill evals against the Anthropic API"
        type: boolean
        default: true

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Test
        run: mix test

  # Real-provider skill evals. Gated by the RUN_EVALS flag so any repo can turn
  # them off: set the RUN_EVALS variable to "false" to skip, or use the manual
  # run_evals input. Default is on, and a failure blocks the check.
  #
  # Public-repo gates: skip the job on fork PRs (compare head repo to this
  # repository — cleaner than github.event.pull_request.head.repo.fork, and
  # keeps same-repo PRs + main pushes + workflow_dispatch running). Secrets
  # are not available in job-level `if`, so an empty ANTHROPIC_API_KEY is a
  # no-op success rather than a failed mix test.
  evals:
    if: >-
      (
        (github.event_name == 'workflow_dispatch' && inputs.run_evals) ||
        (github.event_name != 'workflow_dispatch' && vars.RUN_EVALS != 'false')
      ) &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Check Anthropic API key
        id: anthropic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is empty; skipping real-provider evals."
          fi

      - uses: actions/checkout@v4
        if: steps.anthropic.outputs.present == 'true'

      - uses: erlef/setup-beam@v1
        if: steps.anthropic.outputs.present == 'true'
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Cache deps
        if: steps.anthropic.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      # Rolling cache: the run_id key never pre-exists, so the result cache is
      # re-saved every run, while restore-keys loads the most recent prior copy.
      - name: Cache eval results
        if: steps.anthropic.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: .skill_kit/eval_cache.bin
          key: ${{ runner.os }}-evalcache-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-evalcache-

      - name: Install dependencies
        if: steps.anthropic.outputs.present == 'true'
        run: mix deps.get

      # Scope to the dogfood suites so only their eval-tagged cases run (a bare
      # --only eval would also sweep in mock-based fixture eval tests). The Case
      # macro's setup swaps in File storage so colocated SKILL.md / AGENT.md
      # files resolve.
      - name: Run skill and agent evals
        if: steps.anthropic.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: mix test test/examples/ --only eval
